name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check moduagent tests benchmarks examples
      - run: ruff format --check moduagent tests benchmarks examples
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip build 'twine>=7,<8'
      - name: Build a wheel from a clean sdist
        run: |
          python -m build --sdist --outdir /tmp/moduagent-sdist
          mkdir -p /tmp/moduagent-source
          tar -xzf /tmp/moduagent-sdist/moduagent-*.tar.gz -C /tmp/moduagent-source
          python -m build --wheel --outdir /tmp/moduagent-wheel /tmp/moduagent-source/moduagent-*
      - name: Verify package namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("/tmp/moduagent-wheel").glob("moduagent-*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          roots = {name.split("/", 1)[0] for name in names if "/" in name}
          if "moduagent" not in roots:
              raise SystemExit("wheel does not contain the moduagent package")
          if any(name.startswith("company_agent/") for name in names):
              raise SystemExit("wheel contains the retired company_agent package")
          unexpected = {
              root
              for root in roots
              if root != "moduagent" and not root.startswith("moduagent-")
          }
          if unexpected:
              raise SystemExit(f"wheel contains unexpected roots: {sorted(unexpected)}")

          sdist = next(Path("/tmp/moduagent-sdist").glob("moduagent-*.tar.gz"))
          with open_tar(sdist, "r:gz") as archive:
              source_names = archive.getnames()
          required_files = {
              "benchmarks/performance_v042.py",
              "docs/delegation.md",
              "docs/migration-0.6.md",
              "examples/01_hello_agent.py",
              "examples/02_use_a_tool.py",
              "examples/03_structured_output.py",
              "examples/04_report_automation.py",
              "examples/05_debug_a_run.py",
              "examples/06_waf_log_analysis.py",
              "examples/10_incident_investigation.py",
              "examples/11_customer_case_resolution.py",
              "examples/12_release_readiness.py",
              "examples/13_document_qa_and_report.py",
              "examples/14_rag_index_manager/__init__.py",
              "examples/14_rag_index_manager/__main__.py",
              "examples/14_rag_index_manager/README.md",
              "examples/14_rag_index_manager/agent.py",
              "examples/14_rag_index_manager/artifacts.py",
              "examples/14_rag_index_manager/backends.py",
              "examples/14_rag_index_manager/catalog.py",
              "examples/14_rag_index_manager/chunking.py",
              "examples/14_rag_index_manager/cli.py",
              "examples/14_rag_index_manager/diagnostics.py",
              "examples/14_rag_index_manager/models.py",
              "examples/14_rag_index_manager/pipeline.py",
              "examples/14_rag_index_manager/planner.py",
              "examples/14_rag_index_manager/requirements.txt",
              "examples/14_rag_index_manager/restructure.py",
              "examples/14_rag_index_manager/scanner.py",
              "examples/14_rag_index_manager/stores.py",
              "examples/20_production_controls.py",
              "examples/INTERMEDIATE.md",
              "examples/INTERMEDIATE.ko.md",
              "examples/PRODUCTION.md",
              "examples/PRODUCTION.ko.md",
              "examples/README.md",
              "examples/SCENARIO_REVIEW.md",
              "tests/integration/test_live_agent_scenarios_v051.py",
              "tests/integration/test_live_intermediate_scenarios_v051a.py",
              "tests/integration/test_live_models.py",
              "tests/integration/test_live_persistence.py",
              "tests/conformance/__init__.py",
              "tests/conformance/contracts.py",
              "tests/conformance/test_adapters_v060.py",
              "tests/test_beginner_examples_v051.py",
              "tests/test_intermediate_customer_example_alpha.py",
              "tests/test_intermediate_incident_example_alpha.py",
              "tests/test_intermediate_release_example_alpha.py",
              "tests/test_model_output_incomplete.py",
              "tests/test_agent_tool_v053.py",
              "tests/test_conversation_store_capacity_v052.py",
              "tests/test_context_history_runtime_v060.py",
              "tests/test_context_assembler_runtime_v060.py",
              "tests/test_context_memory_v060.py",
              "tests/test_conversation_pagination_v060.py",
              "tests/test_definitions_v060.py",
              "tests/test_delegation_foundation_v060.py",
              "tests/test_delegation_runtime_v060.py",
              "tests/test_document_qa_report_example_v060.py",
              "tests/test_rag_index_manager_example_v060.py",
              "tests/test_embedding_contract_v052.py",
              "tests/test_kernel_contracts_v060.py",
              "tests/test_memory_diagnostics_v053.py",
              "tests/test_plan_memory_v052.py",
              "tests/test_production_controls_example_v052.py",
              "tests/test_profiles_v060.py",
              "tests/test_shared_store_warning_v053.py",
              "tests/test_waf_log_analysis_example_v01.py",
          }
          missing_files = {
              expected
              for expected in required_files
              if not any(name.endswith(expected) for name in source_names)
          }
          if missing_files:
              raise SystemExit(
                  f"sdist omits required files: {sorted(missing_files)}"
              )
          generated_files = {
              name
              for name in source_names
              if "/__pycache__/" in name
              or name.endswith((".pyc", ".pyo", ".pyd", ".DS_Store"))
          }
          if generated_files:
              raise SystemExit(
                  f"sdist contains generated files: {sorted(generated_files)}"
              )
          forbidden_files = {
              name
              for name in source_names
              if "/examples/artifacts/" in name
              or "/tmp/" in name
              or name.endswith((".pypi-token", "runpod-vllm-token"))
          }
          if forbidden_files:
              raise SystemExit(
                  f"sdist contains local or sensitive files: {sorted(forbidden_files)}"
              )
          PY
      - name: Verify package metadata and README rendering
        run: |
          python -m twine check \
            /tmp/moduagent-sdist/moduagent-*.tar.gz \
            /tmp/moduagent-wheel/moduagent-*.whl
      - name: Verify clean installation
        run: |
          python -m venv /tmp/moduagent-venv
          /tmp/moduagent-venv/bin/python -m pip install /tmp/moduagent-wheel/moduagent-*.whl
          cd /tmp
          /tmp/moduagent-venv/bin/python -c \
            "import moduagent; assert moduagent.__version__ == '0.6.0'"
          /tmp/moduagent-venv/bin/moduagent --help
