[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moduagent"
version = "0.6.0"
description = "Composable Python runtime for building production AI agents"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agent", "llm", "vllm", "ollama", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/nagix999/moduagent"
Documentation = "https://github.com/nagix999/moduagent/tree/main/docs"
Repository = "https://github.com/nagix999/moduagent.git"
Changelog = "https://github.com/nagix999/moduagent/blob/main/CHANGELOG.md"
Issues = "https://github.com/nagix999/moduagent/issues"

[project.scripts]
moduagent = "moduagent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.5"]
integration = ["pytest>=8", "redis>=5"]

[tool.setuptools.packages.find]
include = ["moduagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
